name: Governance Structure Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['AGENTS.md','README.md','docs/governance/**','docs/deliverables/**','scripts/**','tests/**','.github/workflows/governance-check.yml']
  pull_request:
    paths: ['AGENTS.md','README.md','docs/governance/**','docs/deliverables/**','scripts/**','tests/**','.github/workflows/governance-check.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/governance_check.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
